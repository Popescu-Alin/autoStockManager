<div class="cars-container">
  <header class="cars-header">
    <div>
      <p class="eyebrow">Inventory</p>
      <h1>{{ title }}</h1>
      <p class="subtitle">Manage your fleet, add new vehicles, and keep parts organized.</p>
    </div>
    <div class="actions" *ngIf="isAdmin">
      <button
        pButton
        type="button"
        label="Add Car"
        icon="pi pi-car"
        (click)="openAddCarDialog()"
        class="p-button-primary"
      ></button>
    </div>
  </header>

  <section class="cars-section">
    <div class="cars-section__header">
      <div>
        <p class="eyebrow">Highlights</p>
        <h2>Featured Cars</h2>
        <p class="subtitle">A quick look at vehicles currently in stock.</p>
      </div>
    </div>

    <div class="search-container">
      <input
        type="text"
        pInputText
        [(ngModel)]="searchValue"
        (input)="onSearchChange()"
        placeholder="Search by brand or model..."
        class="search-input"
      />
    </div>

    <div class="cars-grid" *ngIf="carCards.length > 0">
      <app-car-card-item *ngFor="let car of carCards" [car]="car"> </app-car-card-item>
    </div>
    <div class="no-results" *ngIf="carCards.length === 0 && !isLoading && searchValue.trim()">
      <p>No cars found matching "{{ searchValue }}"</p>
    </div>
  </section>

  <app-car-dialog
    [(visible)]="carDialogVisible"
    [suppliers]="suppliers"
    [loading]="carDialogLoading"
    (onSubmit)="onCarSubmit($event)"
  >
  </app-car-dialog>
</div>
