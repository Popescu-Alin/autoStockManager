<div class="page-container">
  <div class="page-header">
    <h1>Users Management</h1>
    <button
      pButton
      type="button"
      label="Add User"
      icon="pi pi-user-plus"
      (click)="openAddUserDialog()"
      class="p-button-primary"
    ></button>
  </div>

  <div class="search-container">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search users</mat-label>
      <input
        matInput
        [(ngModel)]="searchValue"
        (input)="applyFilter($event)"
        placeholder="Search by name, email, role, or status"
        #searchInput
      />
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-container overflow-y">
    <table mat-table [dataSource]="dataSource" matSort class="users-table">
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>User</th>
        <td mat-cell *matCellDef="let user">
          <div class="user-info">
            <div class="user-name">
              {{
                user.name || ((user.firstName || '') + ' ' + (user.lastName || '')).trim() || 'N/A'
              }}
            </div>
            <div class="user-email">{{ user.email }}</div>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Full Name</th>
        <td mat-cell *matCellDef="let user">
          {{ user.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let user">
          {{ mapStatus(user.status) | titlecase }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Actions menu" *ngIf="user.id !== currentUser?.id">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="openEditUserDialog(user.id)">
              <mat-icon>edit</mat-icon>
              <span>Edit User</span>
            </button>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="sendChangePassword(user.id!)" *ngIf="user.status === 0">
              <mat-icon>lock</mat-icon>
              <span>Send Change Password</span>
            </button>
            <button mat-menu-item (click)="resendInvite(user.id!)" *ngIf="user.status === 2">
              <mat-icon>mail</mat-icon>
              <span>Resend Invite</span>
            </button>
            <button mat-menu-item (click)="changeUserStatus(user)" *ngIf="user.status !== 2">
              <mat-icon>{{ user.status === 0 ? 'check_circle' : 'block' }}</mat-icon>
              <span>{{ user.status === 1 ? 'Enable' : 'Disable' }}</span>
            </button>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="deleteUser(user)" class="delete-action">
              <mat-icon>delete</mat-icon>
              <span>Delete</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          <div class="no-data">No users found</div>
        </td>
      </tr>
    </table>

    <mat-paginator [pageSize]="10" showFirstLastButtons aria-label="Select page of users">
    </mat-paginator>
  </div>

  <app-user-dialog
    [(visible)]="userDialogVisible"
    [loading]="userDialogLoading"
    (onSubmit)="onUserSubmit($event)"
  >
  </app-user-dialog>

  <app-edit-user-dialog
    [(visible)]="editUserDialogVisible"
    [loading]="editUserDialogLoading"
    [editingUser]="editingUser"
    (onSubmit)="onEditUserSubmit($event)"
  >
  </app-edit-user-dialog>
</div>
